# PROD profile — broker addresses and credentials come from the environment
# (ConfigMap bridge-config + Secret bridge-secret in Kubernetes).
#   ARTEMIS_HOST, ARTEMIS_PORT, ARTEMIS_USER, ARTEMIS_PASS
#   KAFKA_HOST, KAFKA_PORT
#   RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USER, RABBITMQ_PASS
#   SCADA_AES_KEY
#   optional: ARTEMIS_SCHEME=ssl, TLS_TRUSTSTORE_PATH, TLS_TRUSTSTORE_PASS

# ── ActiveMQ Artemis (TMS) ────────────────────────────────────────
camel.component.activemq.broker-url=${ARTEMIS_SCHEME:tcp}://${ARTEMIS_HOST}:${ARTEMIS_PORT}
artemis.username=${ARTEMIS_USER}
artemis.password=${ARTEMIS_PASS}
# blank path = plain TCP (SecurityConfig skips the truststore)
tls.truststore.path=${TLS_TRUSTSTORE_PATH:}
tls.truststore.password=${TLS_TRUSTSTORE_PASS:}

# ── Kafka ─────────────────────────────────────────────────────────
kafka.brokers=${KAFKA_HOST}:${KAFKA_PORT}
camel.component.kafka.brokers=${kafka.brokers}
camel.component.kafka.security-protocol=PLAINTEXT

# ── RabbitMQ (SCADA side) ─────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.ssl.enabled=false

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.pinkline.kafkabridge=INFO
logging.level.org.apache.camel=WARN
logging.level.org.apache.activemq=WARN
