# PROD profile — broker addresses and credentials come from the environment
# (ConfigMap bridge-config + Secret bridge-secret in Kubernetes).
#   ARTEMIS_HOST, ARTEMIS_PORT, ARTEMIS_USER, ARTEMIS_PASS
#   KAFKA_HOST, KAFKA_PORT
#   RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USER, RABBITMQ_PASS
#   SCADA_AES_KEY
#   optional: ARTEMIS_SCHEME=ssl, TLS_TRUSTSTORE_PATH, TLS_TRUSTSTORE_PASS

# ── ActiveMQ Artemis (TMS) ────────────────────────────────────────
camel.component.activemq.broker-url=${ARTEMIS_SCHEME:tcp}://${ARTEMIS_HOST}:${ARTEMIS_PORT}
artemis.username=${ARTEMIS_USER}
artemis.password=${ARTEMIS_PASS}
# blank path = plain TCP (SecurityConfig skips the truststore)
tls.truststore.path=${TLS_TRUSTSTORE_PATH:}
tls.truststore.password=${TLS_TRUSTSTORE_PASS:}

# ── Kafka ─────────────────────────────────────────────────────────
kafka.brokers=${KAFKA_HOST}:${KAFKA_PORT}
camel.component.kafka.brokers=${kafka.brokers}
camel.component.kafka.security-protocol=PLAINTEXT

# ── RabbitMQ (SCADA side) ─────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}

# TLS. Stays off for an in-cluster broker; set RABBITMQ_SSL=true when the
# broker sits on another network, otherwise the credentials cross in clear.
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# ── Remote-broker tuning ──────────────────────────────────────────
# Defaults assume a broker one hop away. When RabbitMQ is on the SCADA
# network these keep a brief link blip from becoming a dead-lettered
# message: the RabbitTemplate retries on its own for roughly 25 s before
# the route's onException ever sees a failure.
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECT_TIMEOUT:10s}
spring.rabbitmq.requested-heartbeat=${RABBITMQ_HEARTBEAT:30s}
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=${RABBITMQ_RETRY_ATTEMPTS:5}
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-interval=10s

# ── Logging ───────────────────────────────────────────────────────
logging.level.com.pinkline.kafkabridge=INFO
logging.level.org.apache.camel=WARN
logging.level.org.apache.activemq=WARN
