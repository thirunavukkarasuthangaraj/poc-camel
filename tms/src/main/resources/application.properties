# PAS-SCADA-Kafka-Bridge — route definitions (broker addresses/credentials: application-prod.properties)
# In Kubernetes this file is overridden by the ConfigMap bridge-appprops (same keys).

spring.application.name=PAS-SCADA-Kafka-Bridge
server.port=8085

# ── TMS → SCADA ────────────────────────────────────────────────────
# Traffic Scheduler publishes the final APIS JSON here; forwarded as-is.
bridge.artemis-topics=jms.topic.rcs.e2k.ctc.train.pas.new
bridge.artemis-queues=
bridge.encrypt.enabled=true
bridge.kafka.topic=tms.scada.encrypted
# Kafka → RabbitMQ; the RabbitMQ MQTT plugin delivers it to SCADA as tms/scada/pas
bridge.forward[0].from-kafka=tms.scada.encrypted
bridge.forward[0].to-exchange=amq.topic
bridge.forward[0].routing-key=tms.scada.pas
bridge.forward[0].consumer-group=pas-bridge-consumer

# ── SCADA → TMS ────────────────────────────────────────────────────
# SCADA publishes MQTT scada/tms/alarms → RabbitMQ amq.topic / scada.tms.alarms
bridge.scada-source[0].from-exchange=amq.topic
bridge.scada-source[0].routing-key=scada.tms.alarms
bridge.scada-source[0].queue=scada.tms.alarms.queue
bridge.scada-source[0].to-kafka-topic=scada.tms.processed
bridge.reverse.decrypt-enabled=false
bridge.artemis-sink[0].from-kafka=scada.tms.processed
bridge.artemis-sink[0].consumer-group=pas-bridge-artemis-sink
bridge.artemis-sink[0].to-topic=SCADA.TMS.Alarms

# ── Camel: keep retrying broker connections with backoff ──────────
camel.springboot.main-run-controller=true
camel.springboot.route-controller-supervise-enabled=true
camel.springboot.route-controller-initial-delay=0
camel.springboot.route-controller-back-off-delay=5000
camel.springboot.route-controller-back-off-max-delay=60000
camel.springboot.route-controller-back-off-multiplier=2.0
camel.springboot.route-controller-unhealthy-on-exhausted=false

# ── Health (k8s probes) ───────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Spring Boot auto-configures its own JMS ConnectionFactory from
# spring.activemq.broker-url (default tcp://localhost:61616) and health-checks
# THAT. Nothing uses it: the real Artemis connection is the factory built inside
# the "activemq" component bean in SecurityConfig. Left enabled, the indicator
# reports DOWN forever and /actuator/health returns 503 even when all four
# routes are running — which hides a genuine failure. Artemis is already
# covered by camelHealth.
management.health.jms.enabled=false
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
camel.health.enabled=true
camel.health.routes-enabled=true
