apiVersion: apps/v1
kind: Deployment
metadata:
  name: pas-scada-bridge
  namespace: poc-camel
  labels:
    app: pas-scada-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pas-scada-bridge
  template:
    metadata:
      labels:
        app: pas-scada-bridge
    spec:
      containers:
        - name: pas-scada-bridge
          # Plain Java 17 runtime (imported once on every node). The application
          # itself is the jar in /opt/tms-jars/bridge on the node — copy a new jar
          # there and `rollout restart` to release; no image rebuild.
          image: 10.4.1.28:4001/tms/temurin:17-jre-alpine
          imagePullPolicy: IfNotPresent
          command: ["java", "-jar", "/app/jar/pas-scada-bridge.jar"]
          ports:
            - containerPort: 8085

          # Broker addresses: ConfigMap bridge-config
          envFrom:
            - configMapRef:
                name: bridge-config

          volumeMounts:
            # the jar, from the node's disk
            - name: jar
              mountPath: /app/jar
              readOnly: true
            # topics / routing keys: ConfigMap bridge-appprops
            - name: appprops
              mountPath: /app/config/application.properties
              subPath: application.properties
              readOnly: true
            # TLS truststore (optional Secret bridge-tls-truststore)
            - name: truststore
              mountPath: /etc/ssl/bridge
              readOnly: true

          # Credentials: Secret bridge-secret
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/app/config/application.properties"
            - name: SCADA_AES_KEY
              valueFrom:
                secretKeyRef:
                  name: bridge-secret
                  key: SCADA_AES_KEY
            - name: ARTEMIS_USER
              valueFrom:
                secretKeyRef:
                  name: bridge-secret
                  key: ARTEMIS_USER
            - name: ARTEMIS_PASS
              valueFrom:
                secretKeyRef:
                  name: bridge-secret
                  key: ARTEMIS_PASS
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: bridge-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: bridge-secret
                  key: RABBITMQ_PASS
            - name: TLS_TRUSTSTORE_PASS
              valueFrom:
                secretKeyRef:
                  name: bridge-secret
                  key: TLS_TRUSTSTORE_PASS
                  optional: true

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        # Same path on every node (the pod can be scheduled on any of them):
        #   /opt/tms-jars/bridge/pas-scada-bridge.jar
        - name: jar
          hostPath:
            path: /opt/tms-jars/bridge
            type: Directory
        - name: appprops
          configMap:
            name: bridge-appprops
            items:
              - key: application.properties
                path: application.properties
        # optional; pods start without it (empty mount). For TLS brokers:
        #   kubectl -n poc-camel create secret generic bridge-tls-truststore --from-file=truststore.jks
        - name: truststore
          secret:
            secretName: bridge-tls-truststore
            optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: pas-scada-bridge
  namespace: poc-camel
spec:
  selector:
    app: pas-scada-bridge
  ports:
    - port: 8085
      targetPort: 8085
  type: ClusterIP
