apiVersion: v1
kind: ConfigMap
metadata:
  name: bridge-config
  namespace: poc-camel
data:
  # Broker addresses (env). Credentials: secret.yaml. Topics: configmap-appprops.yaml.
  SPRING_PROFILES_ACTIVE: "prod"

  # ActiveMQ Artemis (TMS)
  ARTEMIS_HOST: "10.4.1.28"
  ARTEMIS_PORT: "61616"
  # TLS acceptor: set ARTEMIS_SCHEME=ssl, TLS_TRUSTSTORE_PATH=/etc/ssl/bridge/truststore.jks,
  # create Secret bridge-tls-truststore (truststore.jks) and add TLS_TRUSTSTORE_PASS to bridge-secret.
  # ARTEMIS_SCHEME: "ssl"
  # TLS_TRUSTSTORE_PATH: "/etc/ssl/bridge/truststore.jks"

  # Kafka
  KAFKA_HOST: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local"
  KAFKA_PORT: "9092"

  # RabbitMQ (SCADA side; external systems consume from it over AMQP or MQTT)
  RABBITMQ_HOST: "rabbitmq-internal.scada.svc.cluster.local"
  RABBITMQ_PORT: "5672"
