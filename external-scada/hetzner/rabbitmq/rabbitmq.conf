# ═══════════════════════════════════════════════════════════════════
# RabbitMQ — SCADA-side broker for the PAS pipeline.
#
# Mirrors the in-cluster config so behaviour is identical:
# the MQTT plugin bridges amq.topic, so routing key tms.scada.pas
# is delivered to MQTT subscribers of tms/scada/pas automatically.
# ═══════════════════════════════════════════════════════════════════

# ── Listeners ────────────────────────────────────────────────
listeners.tcp.default            = 5672
management.tcp.port              = 15672
mqtt.listeners.tcp.default       = 1883
web_mqtt.tcp.port                = 15675

# ── MQTT ─────────────────────────────────────────────────────
# No default_user here, unlike the lab config: every client must
# present real credentials. Set them in .env.
mqtt.allow_anonymous             = false
mqtt.vhost                       = /
mqtt.exchange                    = amq.topic

# ── Hardening ────────────────────────────────────────────────
# guest can only ever connect over loopback, never from the tunnel.
loopback_users.guest             = true
disk_free_limit.absolute         = 500MB
heartbeat                        = 30
